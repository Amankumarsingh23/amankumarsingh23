name: Space Invaders

on:
  schedule:
    - cron: "0 1 * * *"   # runs daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Space Invaders
        uses: Platane/snk@v3
        with:
          github_user_name: amankumarsingh23
          outputs: |
            dist/space-invaders.svg?palette=github-light&color_snake=orange
            dist/space-invaders-dark.svg?palette=github-dark&color_snake=orange

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
