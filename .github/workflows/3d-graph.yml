name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"   # Daily at 6pm UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@0.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: amankumarsingh23
          SETTING_JSON: '{"fileName":"profile-3d-contrib/profile-night-rainbow.svg","githubActivityType":"all"}'

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update 3D contribution graph"
          git push
